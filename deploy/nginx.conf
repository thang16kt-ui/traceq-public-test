server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    # URL paths contain opaque QR tokens. API emits request IDs without raw paths.
    access_log off;
    error_log /dev/stderr crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(self), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /health/ { proxy_pass http://api:8000; }
    # FastAPI's standard Swagger UI uses jsDelivr and an inline initializer.
    # Only the documentation route permits those assets; app CSP stays strict.
    location /docs {
        proxy_pass http://api:8000;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'; base-uri 'self'" always;
    }
    location /redoc { return 302 /docs; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location /assets/ { expires 30d; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
